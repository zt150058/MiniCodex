name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Python tests
        run: python -m pytest -p no:cacheprovider -q

      - name: Run browser logic tests
        run: node --test tests/js/web_gui.test.mjs

      - name: Check command-line entry points
        run: |
          coding-agent --help
          coding-agent-web --help

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "${{ runner.temp }}\wheelhouse"

      - name: Check installed package imports
        run: >-
          python -c "import coding_agent.application.cli;
          import coding_agent.engine.agent;
          import coding_agent.operations.tools.filesystem;
          import coding_agent.web.app"

      - name: Check whitespace errors
        run: git diff --check
